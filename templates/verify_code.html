{% extends "base.html" %}

{% block title %}Verificar Código{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 90vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">✓ Verificar Código</h3>
                    <p class="text-muted">Ingresa el código de 6 dígitos enviado a tu correo</p>
                    <p class="text-muted small"><strong>{{ email }}</strong></p>
                </div>

                <form method="POST">
                    <input type="hidden" name="email" value="{{ email }}">
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="bi bi-asterisk"></i> Código de Verificación</label>
                        <input type="text" name="codigo" class="form-control form-control-lg text-center" 
                               placeholder="000000" maxlength="6" pattern="[0-9]{6}" required
                               style="font-size: 28px; letter-spacing: 10px;">
                        <small class="text-muted d-block mt-2">Código válido por 30 minutos.</small>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3">
                            Verificar Código
                        </button>
                    </div>

                    <div class="text-center">
                        <small class="text-muted">
                            ¿No recibiste el código? 
                            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Intentar de nuevo</a>
                        </small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
