{% extends "base.html" %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 90vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4">
                
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Recuperar Contraseña</h3>
                    <p class="text-muted">Ingresa tu usuario para recibir un código de recuperación</p>
                </div>

                <form method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                        </div>
                        <small class="text-muted d-block mt-2">
                            Te enviaremos un código temporal al correo registrado.
                        </small>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3">
                            Enviar código
                        </button>
                    </div>

                    <div class="text-center">
                        <small class="text-muted">
                            ¿Recuerdas tu contraseña? 
                            <a href="{{ url_for('login') }}" class="text-decoration-none">Inicia sesión</a>
                        </small>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
