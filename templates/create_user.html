{% extends "base.html" %}

{% block title %}Crear Usuario{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h2 class="fw-bold mb-1">Crear Nuevo Usuario</h2>
            <p class="text-muted mb-0">Registra un nuevo usuario en el sistema</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <form method="POST" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person-circle"></i> Usuario *
                            </label>
                            <input type="text" class="form-control" id="username" name="username" required value="{{ request.form.get('username', '') }}">
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-semibold">
                                <i class="bi bi-phone"></i> Teléfono *
                            </label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" required value="{{ request.form.get('telefono', '') }}" placeholder="Ej: 3001234567">
                        </div>

                        <div class="mb-3">
                            <label for="nombre_completo" class="form-label fw-semibold">
                                <i class="bi bi-person"></i> Nombre Completo *
                            </label>
                            <input type="text" class="form-control" id="nombre_completo" name="nombre_completo" required value="{{ request.form.get('nombre_completo', '') }}">
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-semibold">
                                <i class="bi bi-shield-check"></i> Rol *
                            </label>
                            <select class="form-select" id="rol" name="rol" required>
                                <option value="">Seleccionar rol...</option>
                                <option value="admin" {% if request.form.get('rol') == 'admin' %}selected{% endif %}>Administrador</option>
                                <option value="operador" {% if request.form.get('rol') == 'operador' %}selected{% endif %}>Operador</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">
                                <i class="bi bi-key"></i> Contraseña *
                            </label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <div class="form-text">La contraseña debe tener al menos 8 caracteres</div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">
                                <i class="bi bi-key-fill"></i> Confirmar Contraseña *
                            </label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Crear Usuario
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
