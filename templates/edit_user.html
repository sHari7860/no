{% extends "base.html" %}

{% block title %}Editar Usuario{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h2 class="fw-bold mb-1">Editar Usuario</h2>
            <p class="text-muted mb-0">Modifica la información del usuario</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <form method="POST" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person-circle"></i> Usuario *
                            </label>
                            <input type="text" class="form-control" id="username" name="username" required value="{{ user[1] }}">
                        </div>


                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">
                                <i class="bi bi-envelope"></i> Correo Electrónico *
                            </label>
                            <input type="text" class="form-control" id="email" name="email" required value="{{ user[2] }}">
                        </div>


                        <div class="mb-3">
                            <label for="nombre_completo" class="form-label fw-semibold">
                                <i class="bi bi-person"></i> Nombre Completo *
                            </label>
                            <input type="text" class="form-control" id="nombre_completo" name="nombre_completo" required value="{{ user[3] }}">
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-semibold">
                                <i class="bi bi-shield-check"></i> Rol *
                            </label>
                            <select class="form-select" id="rol" name="rol" required>
                                <option value="">Seleccionar rol...</option>
                                <option value="admin" {% if user[4] == 'admin' %}selected{% endif %}>Administrador</option>
                                <option value="operador" {% if user[4] == 'operador' %}selected{% endif %}>Operador</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="activo" class="form-label fw-semibold">
                                <i class="bi bi-toggle-on"></i> Estado
                            </label>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="activo" name="activo" {% if user[5] %}checked{% endif %}>
                                <label class="form-check-label" for="activo">
                                    Usuario activo
                                </label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="require_password_change" class="form-label fw-semibold">
                                <i class="bi bi-key"></i> Cambio de Contraseña
                            </label>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="require_password_change" name="require_password_change" {% if user[6] %}checked{% endif %}>
                                <label class="form-check-label" for="require_password_change">
                                    Forzar cambio de contraseña en próximo inicio de sesión
                                </label>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{{ url_for('users') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Guardar Cambios
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</div>

{% endblock %}
